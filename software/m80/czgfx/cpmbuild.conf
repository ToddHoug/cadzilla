#
# How tools/build.sh builds the czgfx library (key = value; see
# tools/altairsim/scripts/cpmsession.py): CZBUILD.SUB assembles every module,
# LIB80s them into CZGFX.REL, copies CZGFX.REL, CZGFX.INC and CZLINK.SUB onto
# the build disk (B:, libdisk/CZGFXLIB.DSK) and links CZCHK against it.
name   = CZGFX
submit = CZBUILD
binary = *.REL
text   = *.PRN
