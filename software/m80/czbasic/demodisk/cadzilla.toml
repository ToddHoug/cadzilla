# CZBASIC demo disk: boots CP/M 2.2 (62K) from CZBDEMO.DSK (drive 0) on the
# CADzilla board at 1024x768. The disk holds CZBASIC.COM, the CZ graphics
# demos, the MBASIC sample programs, PIP and STAT -- see CZBASIC.TXT on the disk.
#
#     cd software/m80/czbasic/demodisk && altairsim cadzilla.toml
#
# Paths are relative to this file. Same machine as work/cadzilla.toml (a delta
# on altairsim's built-in `cadzilla`), with only the demo disk mounted.

[machine]
name = "czbasic-demo"
base = "cadzilla"
startup = ["RUN FF00"]

[console]
bsdel = "bs"

[[board]]
id   = "cad0"
mode = "1024x768"

[[board]]
id = "dsk0"

  [[board.drive]]
  unit  = 0
  mount = "CZBDEMO.DSK"

[[board]]
type = "memory"
id   = "mem0"
fill = "random"

  [[board.region]]
  type = "ram"
  at   = 0000
  size = "62K"

  [[board.region]]
  type  = "rom"
  at    = FF00
  mount = "builtin:dbl"
