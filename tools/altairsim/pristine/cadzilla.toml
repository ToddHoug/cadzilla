# CADzilla's CP/M dev bench: the REAL board machine (altairsim's machines/cadzilla.toml --
# HD63484 ACRTC + Bt453 RAMDAC, docs/boards/cadzilla.md) with CP/M boot support layered
# on top, so 8080 software for this repo assembles, runs, and can be single-stepped
# under CP/M 2.2 on the same port map the real board answers to -- not a generic Altair.
#
# This is the PRISTINE copy (tools/altairsim/pristine/) -- read-only master, never
# mutated, booted, or mounted directly. Every software/<toolchain>/<project>/ gets its OWN copy of
# this file + the disk(s) beside it, in its own gitignored software/<toolchain>/<project>/work/ --
# so each project has a persistent disk that's never shared with (or reset by) any
# other project. `tools/altairsim/scripts/sync_pristine.sh <dest-dir>` makes the copy
# (`--machine-only` refreshes just this file in an existing work/, keeping its disks).
#
#     cd software/<toolchain>/<project>/work && altairsim cadzilla.toml    # a human, at the A0> prompt
#
# The MCP server starts on the built-in `cadzilla` machine (no disks) and is pointed at
# a project with `CONFIG LOAD <repo>/software/<toolchain>/<project>/work/cadzilla.toml` -- see
# tools/altairsim/README.md.
#
# The disk images here are TEMPLATES, named for what they hold:
#   CPM22SYS.DSK  an 8MB virtual hard disk carrying CP/M 2.2 (62K), ASM.COM, LOAD.COM,
#                 DDT.COM, M80/L80/LIB80, and the host-bridge R/W/HDIR.COM utilities used
#                 to move files between the host and CP/M -- this build boots to an "A0>"
#                 prompt (logical-unit numbering), not the plain "A>" of an 8" floppy
#                 image. A project's work/ gets a copy under the same name: its A: disk.
#   EMPTY.DSK     an empty 8MB volume. A project's work/ gets a copy named SCRATCH.DSK,
#                 its B: disk; czgfx's build disk (software/m80/czgfx/libdisk/CZGFXLIB.DSK)
#                 starts as a copy too. An M80 project mounts its own copy of the
#                 czgfx release it pins (work/CZGFXLIB-<version>.DSK) as B: instead.
# The mounts below name the WORK copies (CPM22SYS.DSK, SCRATCH.DSK), so this file only
# boots as copied into a work/ by sync_pristine.sh -- never here.
#
# THE PATHS BELOW ARE RELATIVE TO THIS FILE. In a work/ the disks lie beside it, so it
# names them and no directory at all -- which is what lets the folder be copied
# anywhere and still boot.
#
# THIS FILE IS A DELTA on `base = "cadzilla"` (altairsim's machines/cadzilla.toml),
# which already brings everything but the boot path:
#   - fp0: front panel, sense = 0x00 (DBL reads it at FF22 for the 2SIO stop bits: 8N1)
#   - cpu0: 8080, flat out (clock_hz = 0) -- real 2MHz pacing corrupts console input fed
#     through the MCP `run` tool; `SET cpu0 clock_hz=2000000` only when timing matters
#   - sio0: 2SIO console @ 0x10 (unit a = console, unit b = null)
#   - cad0: the board @ 0x70 (ACRTC RS=0 70, MODE 71, ACRTC RS=1 72, Bt453 74-77)
#     -- decodes no memory at all, so nothing below touches it
#   - dsk0: 88-DCDD floppy controller @ 0x08, four drives, all empty
#   - hb0: host bridge @ 0xB0 (R/W/HDIR), hostdir = "" (the launch directory)
#   - mem0: 56K of RAM (0000-DFFF), no boot ROM (the base's; replaced below)
#
# What this file adds is exactly what turns that bench into something CP/M boots on,
# plus the one board strap every project has to agree with:
#   - startup  RUN FF00, the boot PROM
#   - console  bsdel = bs, for CP/M's line editor
#   - cad0     MODIFIED: the monitor resolution, stated here rather than inherited
#   - dsk0     MODIFIED: this project's disks in drives 0 and 1
#   - mem0     REPLACED: 62K of RAM (0000-F7FF) plus the DBL boot PROM at FF00. `type` +
#              a base id replaces the board outright, so the RAM region is re-stated too.

[machine]
name = "cadzilla-cpm"
base = "cadzilla"

# THE BOOT PROM IS THE BOOT COMMAND. `RUN FF00` is EXAMINE FF00 / RUN on a real disk
# Altair. A human launching this file boots straight to A0>. Under --mcp the startup is
# NOT run -- the assistant boots it itself with `run {from: 0xFF00}`, so nothing blocks
# before it has control.
startup = ["RUN FF00"]

# THE BACKSPACE KEY. A modern terminal's Backspace sends DEL (0x7F); CP/M's line editor
# wants BS (0x08). `bsdel = bs` folds DEL -> BS on the way in so Backspace erases at the
# A0> prompt. It is a property of the TERMINAL, so it lives on the [console].
[console]
bsdel = "bs"

# THE MONITOR. No `type`, so this reaches into the base's own cad0 and sets its `mode`
# strap: the fixed-frequency VESA monitor the board drives, one of 640x480, 800x600 or
# 1024x768. The board does not reject a mismatch -- a program that programs another
# mode's ACRTC timing just shows its picture in the wrong place in this mode's frame --
# so a program and its machine must agree. It is stated here, not inherited, because
# the base's own default has changed before (640x480 to 1024x768) and a project must
# never be silently re-strapped by that.
#
# 1024x768 is the default for new projects. A project that wants another resolution
# says so in its own tracked software/<toolchain>/<project>/machine.toml overlay (a [[board]]
# id = "cad0" block), which sync_pristine.sh appends after this file into the
# project's work/cadzilla.toml -- a later block for the same id overrides this one.
[[board]]
id   = "cad0"
mode = "1024x768"

# THE DISKS. No `type`, so this reaches into the base's own 88-DCDD at 0x08 (the port
# the boot PROM and every Altair CP/M BIOS are hard-wired to) and mounts this project's
# disks in it, leaving everything else about the controller as the base set it.
[[board]]
id = "dsk0"

  [[board.drive]]
  unit  = 0
  mount = "CPM22SYS.DSK"

  [[board.drive]]
  unit  = 1
  mount = "SCRATCH.DSK"

# MEMORY, REPLACED. The base's mem0 is 56K of plain RAM with no boot ROM; this CP/M disk
# is a 62K system (0000-F7FF: CCP C600, BDOS CE06, BIOS DC00-F7FF), made with MOVCPM8M 62
# and SYSGEN on 2026-10-08 -- it was 56K, but GSX applications (DR Graph, DEMOGRAF) need
# the 6K more TPA beside a GSX driver. The DBL boot PROM is at FF00. A 56K disk boots here
# too (older work/ disks); a 62K disk does NOT boot in 56K. cad0 decodes no memory at all,
# so nothing here touches the graphics board.
[[board]]
type = "memory"
id   = "mem0"
fill = "random"

  [[board.region]]
  type = "ram"
  at   = 0000
  size = "62K"

  [[board.region]]
  type  = "rom"
  at    = FF00
  mount = "builtin:dbl"
